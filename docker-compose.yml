version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: videohub
      POSTGRES_PASSWORD: videohub
      POSTGRES_DB: videohub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - '4000:4000'
  worker:
    build: ./worker
    env_file:
      - .env
    depends_on:
      - redis
      - minio
      - postgres
  frontend:
    build: ./frontend
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - '3000:3000'
volumes:
  postgres_data:
  minio_data:
